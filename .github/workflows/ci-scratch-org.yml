name: CI - Scratch Org Validation

# Runs on every PR into main: spins up a scratch org, deploys metadata,
# runs Apex tests, then tears the org down.
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Verify sf CLI
        run: sf --version

      - name: Write JWT private key to file
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate Dev Hub via JWT
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_DEVHUB_USERNAME }} \
            --alias devhub \
            --set-default-dev-hub \
            --instance-url https://login.salesforce.com

      - name: Create scratch org
        run: |
          sf org create scratch \
            --target-dev-hub devhub \
            --definition-file config/project-scratch-def.json \
            --alias ci-scratch \
            --duration-days 1 \
            --set-default \
            --wait 10

      - name: Deploy source to scratch org
        run: sf project deploy start --target-org ci-scratch

      - name: Run Apex tests
        run: |
          sf apex run test \
            --target-org ci-scratch \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 15

      - name: Remove private key from runner
        if: always()
        run: rm -f server.key

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ci-scratch --no-prompt
